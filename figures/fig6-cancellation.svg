  .t { font-size: 17px; font-weight: 600; }
  .st { font-size: 13px; fill: var(--ink2); }
  .lab { font-size: 13px; fill: var(--ink2); }
  .val { font-size: 12px; fill: var(--ink); font-variant-numeric: tabular-nums; }
  .ax { font-size: 11px; fill: var(--muted); font-variant-numeric: tabular-nums; }
  .note { font-size: 11px; fill: var(--muted); }
</style>
<rect width="760" height="422" rx="8" fill="var(--surface)"/>
<text class="t" x="24" y="34">取消：从停止到达到作业真正终止 / Cancellation: stop arrival to real termination</text>
<text class="st" x="24" y="56">只画 9 次可测样本；另有 10 次未测成或设施无效</text>
<text class="st" x="24" y="74">Only the 9 measurable runs; 10 more were untested or invalid</text>
